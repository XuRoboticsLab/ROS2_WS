panthera:
  rosbridge:
    host: "localhost"
    port: 9090

  rates:
    control_hz: 50.0
    publish_hz: 100.0
    watchdog_timeout_s: 0.5

  ik_control:
    kp: [30.0, 50.0, 60.0, 25.0, 15.0, 10.0]
    kd: [ 3.0,  5.0,  6.0,  2.5,  1.5,  1.0]

  safe_position:
    joint_pos: [0.0, 0.5, 0.6, 0.0, 0.0, 0.0]
    joint_vel: [0.5, 0.5, 0.5, 0.5, 0.5, 0.5]

  twist_scale:
    translation_m: 0.005
    rotation_rad:  0.003
    # "absolute":    target = init + delta  适合 XR 手柄（每帧发绝对偏移量）
    # "incremental": target += delta        适合 joystick / keyboard（每帧发速度增量）
    mode: "incremental"

  joints:
    names:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6

  topics:
    cmd:     "/joystick/right/cmd"
    gripper: "/joystick/right/gripper"
    reset:   "/joystick/right/reset"
    joints:  "/robot/joint_states"
    ee:      "/robot/end_effector"
    


xr_publisher:
  rosbridge:
    host: "localhost"
    port: 9090

  grip:
    threshold: 0.5
    double_tap_window_s: 0.4

  scale:
    translation_m: 1.0    # XR 位移 → Twist linear 缩放
    rotation_rad:  1.0    # XR 旋转 → Twist angular 缩放
    max_delta_pos_m: 0.3  # 单步最大位移，超出则忽略

  # XR 坐标系 → 机械臂坐标系映射矩阵 (行向量 = 机械臂轴)
  coord_mapping:
    pos: [[0, 0, 1],   # 机械臂 X ← XR Z
          [1, 0, 0],   # 机械臂 Y ← XR X
          [0, 1, 0]]   # 机械臂 Z ← XR Y
    rot: [[0, 0, 1],
          [1, 0, 0],
          [0, 1, 0]]

  topics:
    right_cmd:      "/joystick/right/cmd"
    left_cmd:       "/joystick/left/cmd"
    right_gripper:  "/joystick/right/gripper"
    left_gripper:   "/joystick/left/gripper"
    right_reset:    "/joystick/right/reset"
    left_reset:     "/joystick/left/reset"
    emergency:      "/joystick/emergency"