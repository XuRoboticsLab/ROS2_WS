# ── 控制模式 ──────────────────────────────────────────────────────────────
# "dual"   双臂，14 维动作 [right(6), right_grip, left(6), left_grip]
# "right"  右臂，7 维动作  [joints(6), gripper(1)]
# "left"   左臂，7 维动作  [joints(6), gripper(1)]
mode: "dual"

rosbridge:
  host: "localhost"
  port: 9090

model:
  # dual 模式用双臂 checkpoint，left/right 模式换成对应单臂 checkpoint
  config_name: "pi05_ht_left_arm_lora_open_top_drawer"
  checkpoint_dir: "/home/xuroboticslab/ws/openpi/checkpoints/left_arm_open_top_drawer/6000"
  fallback_prompt: "Close the top drawer."
  image_height: 180
  image_width: 320

joints:
  # 与 vla_control 发布的 JointState name 列表一致
  right_names:  ["joint_1", "joint_2", "joint_3", "joint_4", "joint_5", "joint_6"]
  left_names:   ["joint_1", "joint_2", "joint_3", "joint_4", "joint_5", "joint_6"]
  gripper_name: "gripper"

topics:
  # ── 相机 topics（根据 mode 自动选取需要的） ──────────────────────────
  cameras:
    extern:      "/camera_extern/color/image_raw"
    left_wrist:  "/camera_left/color/image_raw"    # dual + left 模式使用
    right_wrist: "/camera_right/color/image_raw"   # dual + right 模式使用

  subscribe:
    # 触发推理：publish std_msgs/String，data 字段作为语言指令
    trigger:      "/vla/trigger"
    # 关节状态（由 vla_control 持续发布）
    right_joints: "/vla_robot/right/joint_states"  # dual + right 模式使用
    left_joints:  "/vla_robot/left/joint_states"   # dual + left 模式使用

  publish:
    # 动作 chunk：std_msgs/Float32MultiArray，扁平 (chunk * action_dim,)
    # dual → chunk*14，left/right → chunk*7
    actions: "/vla/actions"
