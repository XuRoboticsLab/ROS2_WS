rosbridge:
  host: "localhost"
  port: 9090

publish_hz: 100.0

# 每个元素是一对主从臂，可以任意增减
pairs:
  - name: "pair_1"
    leader:   "/home/xuroboticslab/ws/Panthera-HT_SDK/panthera_python/robot_param/Leader_1.yaml"
    follower: "/home/xuroboticslab/ws/Panthera-HT_SDK/panthera_python/robot_param/Follower_1.yaml"
    topics:
      joint_states: "/follower_1/joint_states"
      end_effector: "/follower_1/end_effector"

  - name: "pair_2"
    leader:   "/home/xuroboticslab/ws/Panthera-HT_SDK/panthera_python/robot_param/Leader_2.yaml"
    follower: "/home/xuroboticslab/ws/Panthera-HT_SDK/panthera_python/robot_param/Follower_2.yaml"
    topics:
      joint_states: "/follower_2/joint_states"
      end_effector: "/follower_2/end_effector"

control:
  kp: [10.0, 21.0, 21.0, 16.0, 13.0, 1.0]
  kd: [1.0,   2.0,  2.0,  0.9,  0.8,  0.1]
  gripper_kp: 4.0
  gripper_kd: 0.4
  friction:
    Fc:            [0.15, 0.12, 0.12, 0.12, 0.04, 0.04]
    Fv:            [0.05, 0.05, 0.05, 0.03, 0.02, 0.02]
    vel_threshold: 0.02
  tor_threshold:   [0.5, 1.0, 1.0, 0.5, 0.3, 0.3]