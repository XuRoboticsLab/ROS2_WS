# pico_z1_arm.yaml  —  Z1 机械臂控制端配置（MoveL 版）
# 运行: python pico_z1/z1_main.py --config configs/pico_z1_arm.yaml

ipc:
  # 填写 Pico 控制机的局域网 IP，端口与 pico_z1_pico.yaml 一致
  # 同机部署：改回 tcp://127.0.0.1:5679
  address: "tcp://192.168.8.78:5679"
  arm_side: "right"

z1:
  lib_path: "/home/fins/test_ws/src/z1_sdk/lib"
  has_gripper: true

control:
  rate_hz: 50.0
  watchdog_timeout_s: 0.5
  max_joint_step_rad: 0.05   # 每拍最大关节步长（rad），超出则等比截断

# Pico 偏移量缩放（param_server 可实时调节）
scale:
  translation_m: 0.7
  rotation_rad:  1.0

# 摇杆精细控制（Grip 松开时生效）
fine_control:
  scale_m_per_s: 0.05

# 初始位置 [rx, ry, rz, x, y, z]
start_pose:
  cartesian: [0, 0, 0, 0.2, 0, 0.35]
  gripper: 0.0
  speed: 0.3

# MoveL gripper 参数（对应 Z1 SDK 的 gripperPos 范围，实测后调整）
gripper:
  open_pos:   0.0   # trigger 松开时的目标位置（rad，实测后调整）
  close_pos: -1.0   # trigger 按下时的目标位置（rad）
  speed_rad_s: 2.0  # setGripperCmd 速度参数
  max_torque:  2.0  # setGripperCmd 力矩上限

param_server:
  port: 8082
  arm_name: "Z1 机械臂"
