# =============================================================================
# data_collector config.yaml – example configuration
# =============================================================================

recording:
  # Recording (trigger) frequency in Hz.
  # The node saves one snapshot per tick, aligned to the primary topic.
  frequency: 15.0

  # Root directory where recorded files will be written.
  # Sub-folders per session can be added in the launch file if desired.
  # output_dir: ./data/0425
  # output_dir: ./data/close_top_drawer
  # output_dir: ./data/open_bottom_drawer
  # output_dir: ./data/close_bottom_drawer
  # output_dir: ./data/pick_cube_above
  # output_dir: ./data/pick_cube_top
  # output_dir: ./data/pick_cube_bottom
  output_dir: ./data/useless_left

  # Size of the in-memory ring buffer for each topic.
  # Larger values let the aligner look further back in time.
  buffer_size: 100

  # Foot pedal topics
  foot_pedal_topic: /foot_pedal/press    # start / stop recording
  save_topic: /foot_pedal/save           # keep the session after verify
  delete_topic: /foot_pedal/delete       # discard the session after verify


# =============================================================================
# Topics to record
# =============================================================================
# Each entry requires:
#   name      – used in the saved filename:  <timestamp_ns>_<name>.<ext>
#   topic     – full ROS topic string
#   msg_type  – '<package>/<MessageClass>'
#   is_primary – (optional, default false) exactly ONE topic should be true.
#                The primary topic's timestamp is used as the reference for
#                aligning all other topics.  Typically set on the lowest-rate
#                topic (e.g. robot joint state) so that faster topics (camera)
#                have plenty of nearby messages to match.
# =============================================================================

topics:
# subscribe
  - name: left
    topic: /left/color/image_raw
    msg_type: sensor_msgs/Image
    is_primary: true

  - name: right
    topic: /right/color/image_raw
    msg_type: sensor_msgs/Image
    is_primary: false

  - name: extern
    topic: /extern/color/image_raw
    msg_type: sensor_msgs/Image
    is_primary: false

  
  - name: left_joint
    topic: /follower_left/joint_states
    msg_type: sensor_msgs/JointState
    is_primary: false
  
  - name: left_ee
    topic: /follower_left/end_effector
    msg_type: geometry_msgs/PoseStamped
    is_primary: false

  - name: right_joint
    topic: /follower_right/joint_states
    msg_type: sensor_msgs/JointState
    is_primary: false

  - name: right_ee
    topic: /follower_right/end_effector
    msg_type: geometry_msgs/PoseStamped
    is_primary: false

  # - name: left
  #   topic: /left/joint_states
  #   msg_type: sensor_msgs/JointState
  #   is_primary: true
  
  # - name: left_ee
  #   topic: /left/end_effector
  #   msg_type: geometry_msgs/PoseStamped
  #   is_primary: false

  # - name: right
  #   topic: /right/joint_states
  #   msg_type: sensor_msgs/JointState
  #   is_primary: false

  # - name: right_ee
  #   topic: /right/end_effector
  #   msg_type: geometry_msgs/PoseStamped
  #   is_primary: false


# =============================================================================
# Post-recording quality verification
# =============================================================================

verify:
  enabled: true

  # Topic name (the 'name' field above) used as the alignment reference
  primary: left

  # Warn if any topic's max alignment error exceeds this threshold (ms)
  alignment_warn_ms: 10

  # Frames whose gap > dropout_threshold × median_gap are flagged as dropouts
  dropout_threshold: 1.5

  # Topic names for trajectory smoothness analysis (single string or list)
  joint_topics:
    - left_joint
    - right_joint
  ee_topics:
    - left_ee
    - right_ee

  # Show plots and image playback after recording stops
  plot: false

  # Gripper analysis (only runs when plot: true)
  gripper:
    joint_topics:
      - left_joint
      - right_joint
    joint_name: gripper        # name of the gripper joint inside the JointState msg
    transition_factor: 5.0     # jump threshold multiplier for transition detection